# =============================================================================
# OdontoCRM · reverse proxy con TLS interno (Fedora · Fase 10)
#
# Este archivo es la copia versionada del que se instala en
# /etc/nginx/conf.d/odontocrm.conf. `infra/fedora/install.sh` sustituye los
# marcadores __HOST__ (nombre e IP del servidor) los sustituye
# **infra/fedora/nginx/instalar.sh**, que además copia el archivo, publica la CA y lo
# comprueba. NO lo copies a mano: quedaría con `server_name __HOST__;`.
#
#   sudo bash infra/fedora/nginx/instalar.sh --host="odontocrm.local 192.168.1.50"
#
# La guía completa está en INSTALL.md §13 (y `odontocrm red` lo revisa después).
#
# Requisitos que NO se ven aquí y hay que dejar hechos (§12 y §13):
#   - El certificado en /etc/pki/tls/certs/odontocrm.crt y su clave en
#     /etc/pki/tls/private/odontocrm.key (mkcert -install + mkcert __HOST__).
#   - SELinux: nginx necesita salir a la red para llegar al gateway
#     (`setsebool -P httpd_can_network_connect on`) y el directorio de la SPA
#     tiene que llevar la etiqueta del servidor web (§12.1).
#   - firewalld: abrir SOLO 443 a la LAN. El gateway (8090) y los servicios
#     (4001-4008) escuchan en 127.0.0.1 y NO se abren (§12.2).
# =============================================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __HOST__;

    ssl_certificate     /etc/pki/tls/certs/odontocrm.crt;
    ssl_certificate_key /etc/pki/tls/private/odontocrm.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Sin esto, un navegador con la CA instalada sigue aceptando el certificado,
    # pero los que no la tengan verán el aviso (esperado en TLS interno).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # SPA compilada (§9.4): la etiqueta SELinux la pone §12.1.
    root  /opt/odontocrm/apps/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre se pueden cachear para siempre.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # La autoridad (CA) interna, para instalarla en tablets, móviles y TVs: se
    # descarga desde el propio servidor y se instala una sola vez en cada equipo.
    # Es un certificado PÚBLICO (no un secreto) y va por la LAN de la clínica; sin
    # este atajo habría que copiarlo con una memoria USB equipo por equipo.
    #
    # OJO con la ruta: **no** puede vivir en /etc/odontocrm. Ese directorio es
    # `0750 root:odontocrm` (para los secretos) y nginx corre como usuario `nginx`,
    # así que no puede ni atravesarlo: la descarga devolvía **403 en texto plano**
    # (error de nginx, no de la aplicación). La CA se publica en
    # /var/www/odontocrm/ca/, que sí es legible y lleva la etiqueta de SELinux que
    # httpd necesita. Lo prepara infra/fedora/nginx/instalar.sh.
    location = /ca.crt {
        alias /var/www/odontocrm/ca/odontocrm-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="odontocrm-ca.crt"';
        add_header Cache-Control "no-store";
    }

    # La CA en el formato que pide cada plataforma. Windows prefiere DER; Android y Linux,
    # el PEM de arriba; iOS/iPadOS y macOS instalan un **perfil**.
    location = /ca.der {
        alias /var/www/odontocrm/ca/odontocrm-ca.der;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="odontocrm-ca.der"';
        add_header Cache-Control "no-store";
    }

    # OJO con el tipo: si no se sirve como `application/x-apple-aspen-config`, Safari
    # muestra el XML como texto y **no ofrece instalarlo**.
    location = /odontocrm.mobileconfig {
        alias /var/www/odontocrm/ca/odontocrm.mobileconfig;
        default_type application/x-apple-aspen-config;
        add_header Cache-Control "no-store";
    }

    # Un solo comando para los equipos de la consulta.
    location = /ca-windows.ps1 {
        alias /var/www/odontocrm/ca/ca-windows.ps1;
        default_type text/plain;
        add_header Cache-Control "no-store";
    }

    location = /ca-linux.sh {
        alias /var/www/odontocrm/ca/ca-linux.sh;
        default_type text/plain;
        add_header Cache-Control "no-store";
    }

    # API a través del gateway (que ya rechaza lo que no corresponda).
    location /api/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;   # las descargas (PDF, exportaciones) van mejor así
    }

    # SSE de las pantallas de sala de espera y consultorio
    # (`/api/v1/screens/<pantalla>/stream`): sin búfer, o la pantalla se queda
    # congelada. Va DESPUÉS de /api/ para que gane la coincidencia más específica.
    location /api/v1/screens/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header         X-Accel-Buffering no;
    }
}

# Quien entre por HTTP va al HTTPS (los equipos de la clínica escriben la IP a
# secas y el navegador prueba http primero). El instalador marca este bloque como
# `default_server` si Fedora no lo ha declarado: sin eso, su página de prueba gana
# en el puerto 80 y el redirect no ocurre.
server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    # La CA se sirve también por HTTP a propósito: un equipo que todavía no confía en el
    # certificado no puede descargarla por HTTPS sin pelearse con el aviso —y en el caso del
    # perfil de iOS, Safari directamente no lo ofrece—. Por eso los CINCO formatos tienen
    # que estar aquí, no solo en el bloque de 443: si no, caen en el redirect y el equipo
    # recibe un 301 en vez del archivo.
    location = /ca.crt {
        alias /var/www/odontocrm/ca/odontocrm-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="odontocrm-ca.crt"';
    }

    location = /ca.der {
        alias /var/www/odontocrm/ca/odontocrm-ca.der;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="odontocrm-ca.der"';
    }

    location = /odontocrm.mobileconfig {
        alias /var/www/odontocrm/ca/odontocrm.mobileconfig;
        default_type application/x-apple-aspen-config;
    }

    location = /ca-windows.ps1 {
        alias /var/www/odontocrm/ca/ca-windows.ps1;
        default_type text/plain;
    }

    location = /ca-linux.sh {
        alias /var/www/odontocrm/ca/ca-linux.sh;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
